# End-to-end environment: WordPress (Apache + mod_php) with the plugin mounted, MySQL, and a
# stand-in for RedirHub that serves rules files and receives reports. See e2e/README.md.
name: rh-wp-e2e

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      retries: 60

  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db: { condition: service_healthy }
    ports: ["${WP_PORT:-18080}:80", "${WP_PUBLIC_PORT:-80}:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # A local site: the plugin may then request the private address of the RedirHub stand-in.
      # The image defines WP_DEBUG from WORDPRESS_DEBUG; a second define would be ignored.
      WORDPRESS_DEBUG: "1"
      E2E_DASHBOARD: ${E2E_DASHBOARD:-}
      WORDPRESS_CONFIG_EXTRA: &config |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
        define( 'WP_DEBUG_DISPLAY', false );
        // A test site stays on its image's WordPress: with internet access, a fresh install would
        // update itself mid-run (new installs take major updates) and leave the database behind.
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        // The dashboard the import hands its file to: the mock's stand-in, or a real one (E2E_DASHBOARD).
        define( 'REDIRHUB_DASHBOARD_URL', getenv( 'E2E_DASHBOARD' ) ?: 'http://127.0.0.1:18081' );
    # The site's own hostnames resolve to itself, so WP-Cron's loopback and the self-test work.
    extra_hosts:
      - "promo.example.test:127.0.0.1"
      - "shop.example.test:127.0.0.1"
    volumes:
      - ../:/var/www/html/wp-content/plugins/redirhub-redirects:ro
      - ./fixtures/e2e-fixtures.php:/var/www/html/wp-content/mu-plugins/e2e-fixtures.php:ro

  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on: [wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # wp-config.php reads these at runtime, so WP-CLI needs the same.
      WORDPRESS_DEBUG: "1"
      E2E_DASHBOARD: ${E2E_DASHBOARD:-}
      WORDPRESS_CONFIG_EXTRA: *config
    volumes_from: [wordpress]
    entrypoint: ["sleep", "infinity"]

  mock:
    image: wordpress:cli-php8.3
    user: root
    ports: ["${MOCK_PORT:-18081}:8080"]
    environment:
      MOCK_KEY: e2eIntegrationKey0123456789
    volumes:
      - ./mock:/mock:ro
      - ../spec/v1:/spec:ro
    tmpfs: [/state]
    entrypoint: ["php", "-S", "0.0.0.0:8080", "/mock/server.php"]
